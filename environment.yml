# Ambiente minimo: solo le dipendenze importate direttamente dagli script
# Python del repository. Versioni dell'ambiente "tesi" di sviluppo.
#
#   conda env create -f environment.yml
#
# pyvista e vtk sono pinnati esattamente: la stessa simulazione letta con
# versioni diverse ha dato una CV diversa del 3.5% tra due macchine.
name: tesi
channels:
  - conda-forge
dependencies:
  - python=3.13.15
  - numpy=2.5.3
  - scipy=1.18.0
  - pandas=3.0.5
  - matplotlib=3.11.1
  - h5py=3.16.0
  - meshio=5.3.5
  - pyvista=0.48.4
  - vtk=9.6.2

