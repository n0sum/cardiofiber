# Metodo 2 di Roney et al. 2019 (estimator/roney.py), confronto con lo
# stimatore per faccia su terne di mappe. Tutte le chiavi sono obbligatorie.

# Disco geodetico attorno al baricentro della faccia, in mm; Roney usa un
# quadrato di 5 mm di lato.
patch.radius_mm         = 2.5
# Punti della patch usati nel fit planare, scelti a caso (tutti se sono meno).
patch.n_points          = 20
patch.seed              = 0

# Residuo RMS del fit planare diviso |g| * raggio. 0.14 e' il residuo mediano
# di una piega di 60 gradi che passa per il centro della patch, con 20 punti a
# caso.
fit.max_residual        = 0.14

# Come nello stimatore C++.
mask.min_singular_value = 1e-3
