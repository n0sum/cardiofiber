# Anisotropia casuale per faccia: 25 combinazioni di CV_L e r = CV_L/CV_T
# (experiments/region_cv/aniso_random.csv), un tag a caso per triangolo.
# Tutte e sei le mappe LAT; soglie come aniso_const.
#
# Percorsi relativi alla radice del repository.

experiment_id                = aniso_random

lat_ply                      = data/reference/LA_LAT_aniso_random.ply
ground_truth_ply             = data/reference/LA_GT_aniso_random.ply

# "all" oppure una lista di indici, es. 0,2,4
maps                         = all

mask.min_singular_value      = 1e-3

# Collisioni. Su una piega con angolo phi tra due fronti, la faccia a
# cavallo differisce dai vicini di circa phi/2: 30° prende le pieghe con
# phi >= ~60°. Lontano dalle pieghe il gradiente ruota di pochi gradi tra
# facce adiacenti.
mask.collision_angle_deg     = 30

output_csv                   = output/aniso_random/errors.csv
