# Esperimento di riferimento: anisotropia uniforme su tutta la mesh,
# tutte e sei le mappe LAT.
#
# Percorsi relativi alla radice del repository.

experiment_id                = aniso_const
description                  = riferimento, anisotropia uniforme, 6 mappe

lat_ply                      = data/reference/LA_LAT.ply
ground_truth_ply             = data/reference/LA_fibers_gt.ply
region_cv_csv                = experiments/region_cv/aniso_const.csv

# "all" oppure una lista di indici, es. 0,2,4
maps                         = all

mask.min_singular_value      = 1e-3
mask.min_area_vector_norm    = 1e-12

# Collisioni. Fuori dalla zona di stimolo il gradiente ruota di ~5-9°
# tra facce adiacenti; su una piega con angolo phi tra i fronti la faccia
# a cavallo differisce dai vicini di circa phi/2. 30° prende le pieghe
# con phi >= ~60°, a 3-6 volte la variazione regolare.
mask.collision_angle_deg     = 30

output_csv                   = output/aniso_const/errors.csv
output_mask_csv              = output/aniso_const/mask_pairs.csv
