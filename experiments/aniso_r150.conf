# Anisotropia uniforme, r = 1.50 (region_cv/aniso_r150.csv),
# tutte e sei le mappe LAT.
#
# Percorsi relativi alla radice del repository.

experiment_id                = aniso_r150

lat_ply                      = data/reference/LA_LAT_aniso_r150.ply
ground_truth_ply             = data/reference/LA_fibers_gt.ply
region_cv_csv                = experiments/region_cv/aniso_r150.csv

# "all" oppure una lista di indici, es. 0,2,4
maps                         = all

mask.min_singular_value      = 1e-3

# Collisioni. Su una piega con angolo phi tra due fronti, la faccia a
# cavallo differisce dai vicini di circa phi/2: 30° prende le pieghe con
# phi >= ~60°. Lontano dalle pieghe il gradiente ruota di pochi gradi tra
# facce adiacenti. Sensibilità: aniso_const_coll20 / aniso_const_coll45.
mask.collision_angle_deg     = 30

output_csv                   = output/aniso_r150/errors.csv
output_mask_csv              = output/aniso_r150/mask_pairs.csv
